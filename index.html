<header class="top"><div class="wrap">

  </section>
  <section class="view" id="v-kapcsolat" aria-label="Felületeink" hidden></section>
  <section class="view" id="v-szerk" aria-label="Szerkesztő" hidden></section>
  <noscript><p>Az alkalmazás használatához engedélyezd a JavaScriptet, vagy nézd meg az alkalmakat a <a href="https://krisz.org/alkalmaink/">krisz.org</a> oldalon.</p></noscript>
</main>
